<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ওয়েবসাইট</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* নীল বক্সের স্টাইল - এখানে ছবি সেট করা হয়েছে */
        .blue-box {
            border: 2px solid blue;
            width: 80%;
            height: 300px; /* আপনার প্রয়োজন অনুযায়ী হাইট পরিবর্তন করতে পারেন */
            background-image: url('eisamay_2026-01-05_0oc1dtpg_earth.avif');
            background-size: cover;
            background-position: center;
            margin-bottom: 20px;
        }

        /* লাল বক্সের স্টাইল */
        .red-box {
            border: 2px solid red;
            width: 80%;
            height: 200px; /* আপনার প্রয়োজন অনুযায়ী হাইট পরিবর্তন করতে পারেন */
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <section class="container">
        <!-- নীল বক্স (ছবিসহ) -->
        <div class="blue-box"></div>
        
        <!-- লাল বক্স -->
        <div class="red-box">
            <p>পৃথিবী</p>
        </div>
        
        <div class="content">
            <button>আরও জানুন</button>
        </div>
    </section>

</body>
</html>
