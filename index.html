<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Cinema</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="overlay"></div>

    <header>
        <div class="logo">আমার <span>ভিডিও</span> কালেকশন</div>
        <p>মোবাইলের জায়গা খালি, স্মৃতি থাকুক এখানে।</p>
    </header>

    <main class="gallery">
        <!-- ভিডিও ১ -->
        <div class="card">
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_1" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="info">
                <h3>পারিবারিক ভ্রমণের ভিডিও</h3>
                <span>০৪ মে, ২০২৬</span>
            </div>
        </div>

        <!-- ভিডিও ২ -->
        <div class="card">
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_2" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="info">
                <h3>জন্মদিনের মুহূর্ত</h3>
                <span>১০ এপ্রিল, ২০২৬</span>
            </div>
        </div>

        <!-- ভিডিও ৩ -->
        <div class="card">
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_3" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="info">
                <h3>প্রিয় গানের কালেকশন</h3>
                <span>১২ মার্চ, ২০২৬</span>
            </div>
        </div>
    </main>

    <footer>
        <p>তৈরি করা হয়েছে নিজের জন্য &hearts;</p>
    </footer>

</body>
</html>
