<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .drive-card { transition: all 0.3s ease; border: 1px solid #e0e0e0; }
        .drive-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

    <!-- Header (gggffrg.png এর মতো) -->
    <nav class="bg-white p-4 flex justify-between items-center px-8 border-b">
        <div class="flex items-center text-blue-600 font-bold text-xl">
            <i class="fas fa-cloud-upload-alt mr-2 text-2xl"></i>
            <span>My Video Drive</span>
        </div>
        <div class="text-gray-600 cursor-pointer">
            <i class="fas fa-user-circle text-3xl"></i>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto mt-10 p-4">
        
        <!-- Upload Section (gggffrg.png ডিজাইন অনুযায়ী) -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mb-10">
            <h2 class="text-xl font-bold text-gray-800 mb-6">নতুন ভিডিও যোগ করুন</h2>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="videoTitle" placeholder="ভিডিওর শিরোনাম" 
                    class="flex-1 border border-gray-300 p-3 rounded-lg outline-none focus:border-blue-500 transition">
                <input type="text" id="videoLink" placeholder="ভিডিও লিঙ্ক (URL)" 
                    class="flex-1 border border-gray-300 p-3 rounded-lg outline-none focus:border-blue-500 transition">
            </div>
            <button onclick="addVideo()" class="mt-6 bg-blue-600 text-white font-semibold px-8 py-3 rounded-lg hover:bg-blue-700 transition shadow-md">
                সংরক্ষণ করুন
            </button>
        </div>

        <!-- Video List Header -->
        <h2 class="text-2xl font-bold text-gray-800 mb-6 px-2">আপনার ভিডিওসমূহ</h2>
        
        <!-- Video Grid -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- ভিডিওগুলো এখানে জমা হবে -->
        </div>
    </div>

    <script>
        let videos = JSON.parse(localStorage.getItem('myVideos')) || [];

        function displayVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            if (videos.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">কোন ভিডিও পাওয়া যায়নি। নতুন ভিডিও যোগ করুন।</p>`;
            }

            videos.forEach((video, index) => {
                grid.innerHTML += `
                    <div class="drive-card bg-white rounded-2xl overflow-hidden shadow-sm">
                        <div class="aspect-video bg-gray-200 relative group">
                            <video class="w-full h-full object-cover" controls>
                                <source src="${video.url}" type="video/mp4">
                            </video>
                        </div>
                        <div class="p-4 flex justify-between items-center bg-white">
                            <div class="flex items-center space-x-3 overflow-hidden">
                                <i class="fas fa-video text-blue-500"></i>
                                <span class="font-medium text-gray-700 truncate">${video.title}</span>
                            </div>
                            <button onclick="deleteVideo(${index})" class="text-gray-400 hover:text-red-500 transition ml-2">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function addVideo() {
            const titleInput = document.getElementById('videoTitle');
            const urlInput = document.getElementById('videoLink');

            if (titleInput.value && urlInput.value) {
                videos.push({ title: titleInput.value, url: urlInput.value });
                localStorage.setItem('myVideos', JSON.stringify(videos));
                displayVideos();
                
                // Clear inputs
                titleInput.value = '';
                urlInput.value = '';
            } else {
                alert("দয়া করে শিরোনাম এবং সঠিক লিঙ্ক প্রদান করুন।");
            }
        }

        function deleteVideo(index) {
            if(confirm('ভিডিওটি মুছে ফেলতে চান?')) {
                videos.splice(index, 1);
                localStorage.setItem('myVideos', JSON.stringify(videos));
                displayVideos();
            }
        }

        displayVideos();
    </script>
</body>
</html>
