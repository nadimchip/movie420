<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ভিডিও ড্রাইভ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600"><i class="fas fa-cloud-upload-alt mr-2"></i>My Video Drive</h1>
            <div class="text-gray-500"><i class="fas fa-user-circle text-2xl"></i></div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto p-4">
        
        <!-- ভিডিও আপলোড সেকশন -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-lg font-semibold mb-4">নতুন ভিডিও যোগ করুন</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="videoTitle" placeholder="ভিডিওর শিরোনাম" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                <input type="text" id="videoLink" placeholder="ভিডিও লিঙ্ক (URL)" class="border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <button onclick="addVideo()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition w-full md:w-auto">
                সংরক্ষণ করুন
            </button>
        </div>

        <!-- সংরক্ষিত ভিডিও লিস্ট -->
        <h2 class="text-xl font-semibold mb-4 text-gray-700">আপনার ভিডিওসমূহ</h2>
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- ভিডিও কার্ড এখানে যুক্ত হবে -->
        </div>
    </div>

    <script>
        // ভিডিও ডেটা সংরক্ষণের জন্য অ্যারে (প্রাথমিকভাবে কিছু স্যাম্পল ডেটা)
        let videos = JSON.parse(localStorage.getItem('myVideos')) || [];

        function displayVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            videos.forEach((video, index) => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition border border-gray-100">
                        <div class="aspect-video bg-black">
                            <video class="w-full h-full" controls>
                                <source src="${video.url}" type="video/mp4">
                            </video>
                        </div>
                        <div class="p-4 flex justify-between items-center">
                            <span class="font-medium text-gray-800 truncate">${video.title}</span>
                            <button onclick="deleteVideo(${index})" class="text-red-500 hover:text-red-700">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function addVideo() {
            const title = document.getElementById('videoTitle').value;
            const url = document.getElementById('videoLink').value;

            if (title && url) {
                videos.push({ title, url });
                localStorage.setItem('myVideos', JSON.stringify(videos));
                displayVideos();
                
                // ইনপুট ফিল্ড খালি করা
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoLink').value = '';
            } else {
                alert("দয়া করে শিরোনাম এবং লিঙ্ক দুটোই দিন।");
            }
        }

        function deleteVideo(index) {
            if(confirm('আপনি কি এই ভিডিওটি মুছে ফেলতে চান?')) {
                videos.splice(index, 1);
                localStorage.setItem('myVideos', JSON.stringify(videos));
                displayVideos();
            }
        }

        // পেজ লোড হলে ভিডিওগুলো দেখাবে
        displayVideos();
    </script>

</body>
</html>
