<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ওয়েবসাইট</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* লাল বর্ডারের বক্সের জন্য স্টাইল */
        .image-container {
            border: 2px solid red;
            width: 80%; /* আপনার পছন্দমতো সাইজ কমানো বাড়ানো যাবে */
            height: 60%;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ছবিটি বক্সের ভেতরে সুন্দরভাবে বসে যাবে */
        }

        .content button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <!-- লাল বর্ডারের ভেতরে পৃথিবী ছবিটি -->
        <div class="image-container">
            <img src="eisamay_2026-01-05_0oc1dtpg_earth.avif" alt="পৃথিবী">
        </div>
        
        <div class="content">
            <button>আরও জানুন</button>
        </div>
    </section>

</body>
</html>
