<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ভিডিও কালেকশন</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">আমার<span>ভিডিও</span></div>
            <div class="actions">
                <button class="btn add-btn" onclick="openModal()">+ Add Video</button>
                <button class="btn code-btn" onclick="openModal()">+ Add </> Code</button>
            </div>
        </div>
    </header>

    <main>
        <div class="video-grid" id="videoGrid">
            <!-- এখানে ভিডিওগুলো অটোমেটিক যোগ হবে -->
            <p id="noVideoMsg">কোনো ভিডিও নেই। উপরের বাটন থেকে যোগ করুন।</p>
        </div>
    </main>

    <!-- ভিডিও যোগ করার ফর্ম (Modal) -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>নতুন ভিডিও যোগ করুন</h2>
            <input type="text" id="videoTitle" placeholder="ভিডিওর শিরোনাম">
            <textarea id="videoEmbed" placeholder="ভিডিওর এমবেড কোড (<iframe>) অথবা লিঙ্ক দিন"></textarea>
            <button class="submit-btn" onclick="addNewVideo()">আপলোড করুন</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
